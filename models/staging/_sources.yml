version: 2

# Raw tables are append-only and loaded by scripts/load_raw.py. Each holds every version of
# every row the source ever sent, as text, plus _loaded_at. A key can appear many times.
# Staging turns that into one typed, current row per key.
sources:
  - name: app
    description: Exchange backend database (OLTP), appended daily by update time.
    schema: raw
    tables:
      - name: users
        description: Every extracted version of a user row. The backend updates users in place.
      - name: kyc_submissions
        description: Every extracted version of a KYC attempt (pending, then reviewed).
      - name: deposits
        description: Every extracted version of a deposit (pending, then completed or failed).
      - name: withdrawals
        description: Every extracted version of a withdrawal.
      - name: trades
        description: Trade executions from the matching engine. Some are written days late.

  - name: market
    description: Daily closing prices from a market data provider.
    schema: raw
    tables:
      - name: asset_prices

  - name: tracking
    description: >
      Product analytics events, in the shape of a GA4 / Mixpanel export. Clients retry on
      timeouts, so exact duplicates are expected, and offline devices deliver events days late.
    schema: raw
    tables:
      - name: tracking_events
