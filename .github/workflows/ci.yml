name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PY: python
  DBT: dbt
  DBT_PROFILES_DIR: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: dbt deps

      # Two extracts a week apart, so CI exercises what a single run cannot:
      # the first load, then SCD2 versioning and the incremental path.
      - name: Day 1 - load raw, full build, first snapshot
        run: make day1

      - name: Day 2 - append to raw, incremental run, new SCD2 versions
        run: make day2

      - name: Load day 2 again - must change nothing downstream
        run: make double-load

      - name: Build docs
        run: dbt docs generate --static

      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: target/static_index.html

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the demo in the container
        run: docker compose run --rm demo
