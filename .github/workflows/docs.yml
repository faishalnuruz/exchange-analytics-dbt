name: Publish dbt docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: dbt deps

      # The catalog is read from built tables, so the warehouse is built first.
      - name: Build the warehouse (two-day scenario)
        run: |
          python scripts/generate_data.py --as-of 2026-10-24
          dbt build
          python scripts/generate_data.py --as-of 2026-10-31
          dbt build

      - name: Generate docs
        run: |
          dbt docs generate --static
          mkdir site
          cp target/static_index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
